# whatsapp-mcp, one WhatsApp number. The same file runs every number: each runs as its own
# compose project (`whatsapp-mcp-<label>`), reached at https://${PUBLIC_DOMAIN}/<label>/.
# The shared RustFS and the hub live in docker-compose.yaml and must be up first.
#
# Each number has its own self-contained env file, deploy/.env.<label> (chmod 600, gitignored;
# template in instance.env.example). It holds COMPOSE_FILE=docker-compose.instance.yaml, so
# from this directory:
#
#   cp instance.env.example .env.<label>      # first time: fill it in, then
#   docker compose --env-file .env.<label> up -d
#
# With --env-file compose does not read deploy/.env, so a number can never inherit another
# number's token. Nothing here names a real host or number.
#
# A number that already has data from the single-instance layout keeps it where it is: set
# INSTANCE_DATA_DIR and TENANT_ID in its env file (see instance.env.example), and stop the old
# `whatsapp-mcp` container first. Two processes on one pairing log each other out.
#
# Assumes an existing Traefik attached to the external `network_public` network, with a
# `websecure` entrypoint and a certresolver named `myresolver`. Adjust the labels if yours
# differ. Image: see docker-compose.yaml.
#
# Routes on https://${PUBLIC_DOMAIN}, per number (Traefik strips the /<label> prefix, so the
# app does not know it):
#   /<label>/mcp      → port 39001 (Bearer auth enforced by the app)
#   /<label>/upload   → port 39003 (host-disk file upload, Bearer auth enforced by the app)
#   /<label>/stream   → port 39004 (follow_chat WebSocket stream, token-gated by the app)
# Media is served by the shared stack at /<label>/media/t/…. Port 39002 (status, QR page) is
# not routed: the hub reads it over the Docker network and links to /<label>.
#
# Required env (deploy/.env.<label>):
#   INSTANCE              this number's label: lowercase letters, digits, hyphens
#   PUBLIC_DOMAIN         the one public hostname (same as the shared stack)
#   MCP_AUTH_TOKEN        shared secret for MCP clients (openssl rand -hex 32)
#   NTFY_TOPIC_URL        e.g. https://ntfy.sh/<random-topic>
#   EXPECTED_WA_NUMBER    the number that is allowed to pair, e.g. 5531…
#   MINIO_ROOT_USER       S3 root login of the shared RustFS
#   MINIO_ROOT_PASSWORD   S3 root secret of the shared RustFS
# Optional:
#   INSTANCE_DESCRIPTION  one line the hub shows next to the label
#   HUB_INSTANCE_SECRET   same value as in the shared stack's env
#   INSTANCE_DATA_DIR     host directory for this number's data (default /storage/whatsapp-mcp-<label>)
#   TENANT_ID             media key prefix t/<tenant>/ (default: the label)
#   SEND_COLD_OVERRIDE    anti-ban policy for this number: deny (default) | allow
#   SEND_COLD_ALLOWED_JIDS  numbers you own that may always be messaged (comma list)
#   NTFY_TOKEN            only if the ntfy topic is protected
#   OPENROUTER_API_KEY    enables download_media transcribe=true (Whisper Large v3)
#                         and describe=true (vision model, see VISION_MODEL)
#   AUDIO_PROVIDER        transcription route: openrouter (default) | groq | openai.
#                         Rollback lanes only — set this, never rely on key presence.
#   VISION_MODEL          OpenRouter model id for describe=true (default openai/gpt-6-luna)
#   WATCHDOG_RESTART_AFTER_S  seconds the WhatsApp socket may stay down before the
#                         process exits for `restart: unless-stopped` (default 600; 0 = off)
#   WATCHDOG_MAX_RESTARTS self-restarts allowed per rolling 6 h (default 3; 0 = alert only)
name: whatsapp-mcp-${INSTANCE:?set INSTANCE in this number's env file}

services:
  # One service key for every number: the project name keeps them apart.
  whatsapp-mcp-instance:
    image: ghcr.io/amiticia-autosys/whatsapp-mcp:latest
    container_name: whatsapp-mcp-${INSTANCE}
    restart: unless-stopped
    # No depends_on: the RustFS it talks to is in the shared stack, another compose project.
    environment:
      MCP_TRANSPORT: httpstream
      MCP_HOST: 0.0.0.0
      MCP_PORT: "39001"
      MCP_ENDPOINT: /mcp
      QR_SERVER_HOST: 0.0.0.0
      QR_SERVER_PORT: "39002"
      UPLOAD_SERVER_HOST: 0.0.0.0
      UPLOAD_SERVER_PORT: "39003"
      STREAM_SERVER_HOST: 0.0.0.0
      STREAM_SERVER_PORT: "39004"
      STREAM_PUBLIC_URL: wss://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in this number's env file}/${INSTANCE}/stream
      UPLOAD_PUBLIC_URL: https://${PUBLIC_DOMAIN}/${INSTANCE}/upload
      WHATSAPP_MCP_DATA_DIR: /data
      LOG_LEVEL: info
      # The hub's deep link: the hub page links to /<label> for pairing.
      PUBLIC_QR_URL: https://${PUBLIC_DOMAIN}/${INSTANCE}
      INSTANCE_LABEL: ${INSTANCE}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-}
      HUB_INSTANCE_SECRET: ${HUB_INSTANCE_SECRET:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in this number's env file}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      EXPECTED_WA_NUMBER: ${EXPECTED_WA_NUMBER}
      # ── Anti-ban policy (risk-owner settings, per instance) ───────────
      # deny makes the allow_cold_contact tool param inert, so no agent can
      # talk its way past the cold-contact guard. It is the default here: an
      # instance accepts cold contact only when its operator sets `allow` in
      # its env file, and that belongs on an outreach number only. The
      # allowlist pre-approves numbers you own; it matches exact strings, so
      # list every digit form you send to. Everything else (blocklist, pacer,
      # typing) is on by default. See docs/account-restrictions.md.
      SEND_COLD_OVERRIDE: ${SEND_COLD_OVERRIDE:-deny}
      SEND_COLD_ALLOWED_JIDS: ${SEND_COLD_ALLOWED_JIDS:-}
      # ── S3 media plane (the shared stack's RustFS, by container name) ───
      # The container name, never the service name `minio`: network_public is shared
      # with every other stack on the host, so a bare `minio` could be anyone's.
      S3_ENABLED: "true"
      S3_ENDPOINT: whatsapp-mcp-minio
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: amiticia-media
      S3_REGION: us-east-1
      S3_SKIP_POLICY: "false"
      MEDIA_PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN}/${INSTANCE}/media
      TENANT_ID: ${TENANT_ID:-${INSTANCE}}
      # ── Audio transcription + image description (download_media flags) ──
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AUDIO_PROVIDER: ${AUDIO_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}      # only read when AUDIO_PROVIDER=groq
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}  # only read when AUDIO_PROVIDER=openai
      VISION_MODEL: ${VISION_MODEL:-}
      # ── Connection watchdog (self-heal a wedged socket) ──────────────
      # Empty falls back to the app default (600 s / 3 restarts per 6 h).
      WATCHDOG_RESTART_AFTER_S: ${WATCHDOG_RESTART_AFTER_S:-}
      WATCHDOG_MAX_RESTARTS: ${WATCHDOG_MAX_RESTARTS:-}
    volumes:
      # Bind mount at /storage/whatsapp-mcp-<label>.
      # Host side holds auth_info/, data/whatsapp.db, data/media/, backups/, logs.
      # Lets host cron + offsite backups touch files directly without `docker volume inspect` gymnastics.
      # A number migrated from the single-instance layout points INSTANCE_DATA_DIR at its old directory.
      - ${INSTANCE_DATA_DIR:-/storage/whatsapp-mcp-${INSTANCE}}:/data
    networks:
      - network_public
    # Probe /live (200 whenever the process serves HTTP), never /health. A wedged
    # WhatsApp socket makes /health 503; plain Docker does not restart unhealthy
    # containers and Traefik stops routing to them, which took the MCP and QR
    # URLs down for 63 h on 2026-11-13. The in-process watchdog exits on a wedge
    # and `restart: unless-stopped` does the rest. Mirrors the Dockerfile.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:39002/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public"
      # Every router, service and middleware below carries ${INSTANCE}, so two numbers cannot
      # collide, and each router names its own service: none reaches into another container.
      # All three use Path (exact), never PathPrefix, and strip the /<label> prefix.
      - "traefik.http.middlewares.wa-${INSTANCE}-strip.stripprefix.prefixes=/${INSTANCE}"
      # MCP endpoint — Bearer auth enforced inside the app.
      - "traefik.http.routers.wa-${INSTANCE}-mcp.rule=Host(`${PUBLIC_DOMAIN}`) && Path(`/${INSTANCE}/mcp`)"
      - "traefik.http.routers.wa-${INSTANCE}-mcp.priority=100"
      - "traefik.http.routers.wa-${INSTANCE}-mcp.entrypoints=websecure"
      - "traefik.http.routers.wa-${INSTANCE}-mcp.tls.certresolver=myresolver"
      - "traefik.http.routers.wa-${INSTANCE}-mcp.middlewares=wa-${INSTANCE}-strip"
      - "traefik.http.routers.wa-${INSTANCE}-mcp.service=wa-${INSTANCE}-mcp-svc"
      - "traefik.http.services.wa-${INSTANCE}-mcp-svc.loadbalancer.server.port=39001"
      # Upload endpoint — Bearer auth enforced inside the app (same MCP_AUTH_TOKEN).
      - "traefik.http.routers.wa-${INSTANCE}-upload.rule=Host(`${PUBLIC_DOMAIN}`) && Path(`/${INSTANCE}/upload`)"
      - "traefik.http.routers.wa-${INSTANCE}-upload.priority=100"
      - "traefik.http.routers.wa-${INSTANCE}-upload.entrypoints=websecure"
      - "traefik.http.routers.wa-${INSTANCE}-upload.tls.certresolver=myresolver"
      - "traefik.http.routers.wa-${INSTANCE}-upload.middlewares=wa-${INSTANCE}-strip"
      - "traefik.http.routers.wa-${INSTANCE}-upload.service=wa-${INSTANCE}-upload-svc"
      - "traefik.http.services.wa-${INSTANCE}-upload-svc.loadbalancer.server.port=39003"
      # follow_chat WebSocket presence stream — scoped short-lived token gate enforced inside the
      # app. Traefik forwards the Upgrade/Connection headers, so no extra config is needed for
      # the ws handshake.
      - "traefik.http.routers.wa-${INSTANCE}-stream.rule=Host(`${PUBLIC_DOMAIN}`) && Path(`/${INSTANCE}/stream`)"
      - "traefik.http.routers.wa-${INSTANCE}-stream.priority=100"
      - "traefik.http.routers.wa-${INSTANCE}-stream.entrypoints=websecure"
      - "traefik.http.routers.wa-${INSTANCE}-stream.tls.certresolver=myresolver"
      - "traefik.http.routers.wa-${INSTANCE}-stream.middlewares=wa-${INSTANCE}-strip"
      - "traefik.http.routers.wa-${INSTANCE}-stream.service=wa-${INSTANCE}-stream-svc"
      - "traefik.http.services.wa-${INSTANCE}-stream-svc.loadbalancer.server.port=39004"

networks:
  network_public:
    external: true

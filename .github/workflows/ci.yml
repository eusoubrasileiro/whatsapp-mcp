name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: "Checkout baileys-client (sibling link: dependency)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git clone "https://x-access-token:${GH_PAT}@github.com/AmiticIA-AutoSys/baileys-client.git" ../baileys-client

      - uses: pnpm/action-setup@v4
        id: pnpm-setup
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Build baileys-client
        run: cd ../baileys-client && pnpm install && pnpm run build

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: whatsapp-mcp
          json-summary-path: coverage/coverage-summary.json
          file-coverage-mode: changes

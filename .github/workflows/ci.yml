name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: "Checkout baileys-client (sibling link: dependency)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git clone "https://x-access-token:${GH_PAT}@github.com/AmiticIA-AutoSys/baileys-client.git" ../baileys-client

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Build baileys-client
        run: cd ../baileys-client && pnpm install && pnpm run build

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: whatsapp-mcp
          json-summary-path: coverage/coverage-summary.json
          file-coverage-mode: changes

  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: "Checkout baileys-client (sibling build context)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git clone "https://x-access-token:${GH_PAT}@github.com/AmiticIA-AutoSys/baileys-client.git" ../baileys-client

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: baileys=${{ github.workspace }}/../baileys-client
          push: true
          tags: ghcr.io/amiticia-autosys/whatsapp-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
